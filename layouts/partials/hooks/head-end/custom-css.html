<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&display=swap"
>
<style>
  /* Motto under the About Me bio: quiet, centered, serif. The Chinese line
     prefers a locally installed Kai (楷体) face for a lighter, more delicate
     stroke, falling back to Noto Serif SC. */
  .motto {
    margin-top: 1.75rem;
    /* The motto's own <p>s have no margins, so carry the breathing room to the
       Download CV button here. */
    margin-bottom: 2rem;
    text-align: center;
    line-height: 1.9;
    opacity: 0.8;
  }
  .motto p {
    margin: 0;
  }
  .motto-en {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 1rem;
  }
  .motto-zh,
  .name-zh {
    font-family: 'Kaiti SC', 'STKaiti', 'KaiTi', 'BiauKai', 'Noto Serif SC',
      'Songti SC', 'Source Han Serif SC', serif;
    font-weight: 300;
  }
  .motto-zh {
    font-size: 1.15rem;
    letter-spacing: 0.08em;
    margin-top: 0.35rem !important;
  }

  /* Chinese name under the display name in the biography blox. */
  .name-zh {
    font-size: 1.35rem;
    letter-spacing: 0.14em;
    text-indent: 0.14em; /* offset the trailing letter-spacing so it stays centered */
    line-height: 1.4;
    opacity: 0.85;
  }

  /* Featured publication cards: fixed-width list, media contained (not cropped) */
  .pub-card-list {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 56rem;
    min-width: 0;
    margin-left: auto;
    margin-right: auto;
  }
  /* Each card is a block that fills the list width and stacks vertically. */
  .pub-card-list > .pub-card {
    width: 100%;
  }
  /* Media link is transparent to layout so the image/video sizes as before. */
  .pub-card-media > a {
    display: contents;
  }
  /* Attachment button row (PDF, Cite, Video, …) below each card's text. */
  .pub-card-links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem 0.9rem;
    margin-top: 0.85rem;
  }
  .pub-card-row {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-width: 0;
  }
  .pub-card-row > * {
    min-width: 0;
  }
  /* Text column fills the space left of the fixed-width media (no overlap). */
  .pub-card-row > .p-8 {
    flex: 1 1 0%;
    min-width: 0;
  }
  .pub-card-media {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 16rem;
    width: 100%;
    flex-shrink: 0;
    padding: 0.5rem;
    box-sizing: border-box;
  }
  .pub-card-media img,
  .pub-card-media video {
    max-height: 100%;
    max-width: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
  }
  @media (min-width: 768px) {
    .pub-card-row {
      flex-direction: row;
      align-items: center;
    }
    .pub-card-media {
      width: 24rem;
    }
  }

  /* Clickable author names linking to homepages (junjieye.com style):
     blend in with the surrounding author text — same color, no bold, no
     underline — and only reveal an underline + slight darkening on hover. */
  .li-cite-author a.author-link,
  .article-metadata a.author-link {
    color: inherit;
    font-weight: inherit;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .li-cite-author a.author-link:hover,
  .article-metadata a.author-link:hover {
    color: #555;
    border-bottom-color: #999;
  }
  html.dark .li-cite-author a.author-link:hover,
  html.dark .article-metadata a.author-link:hover {
    color: #fff;
    border-bottom-color: rgba(255, 255, 255, 0.5);
  }
</style>
