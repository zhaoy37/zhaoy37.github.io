<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&display=swap"
>
<style>
  /* Motto under the About Me bio: quiet, centered, serif. The Chinese line
     prefers a locally installed Kai (楷体) face for a lighter, more delicate
     stroke, falling back to Noto Serif SC. */
  .motto {
    margin-top: 1.75rem;
    /* The motto's own <p>s have no margins, so carry the breathing room to the
       Download CV button here. */
    margin-bottom: 2rem;
    text-align: center;
    line-height: 1.9;
    opacity: 0.8;
  }
  .motto p {
    margin: 0;
  }
  .motto-en {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 1rem;
  }
  .motto-zh,
  .name-zh {
    font-family: 'Kaiti SC', 'STKaiti', 'KaiTi', 'BiauKai', 'Noto Serif SC',
      'Songti SC', 'Source Han Serif SC', serif;
    font-weight: 300;
  }
  .motto-zh {
    font-size: 1.15rem;
    letter-spacing: 0.08em;
    margin-top: 0.35rem !important;
  }

  /* Chinese name under the display name in the biography blox. */
  .name-zh {
    font-size: 1.35rem;
    letter-spacing: 0.14em;
    text-indent: 0.14em; /* offset the trailing letter-spacing so it stays centered */
    line-height: 1.4;
    opacity: 0.85;
  }

  /* Featured publication cards: fixed-width list, media contained (not cropped) */
  .pub-card-list {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 56rem;
    min-width: 0;
    margin-left: auto;
    margin-right: auto;
  }
  /* Each card is a block that fills the list width and stacks vertically. */
  .pub-card-list > .pub-card {
    width: 100%;
  }
  /* Media link is transparent to layout so the image/video sizes as before. */
  .pub-card-media > a {
    display: contents;
  }
  /* Attachment button row (PDF, Cite, Video, …) below each card's text. */
  .pub-card-links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem 0.9rem;
    margin-top: 0.85rem;
  }
  .pub-card-row {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-width: 0;
  }
  .pub-card-row > * {
    min-width: 0;
  }
  /* Text column fills the space left of the fixed-width media (no overlap). */
  .pub-card-row > .p-8 {
    flex: 1 1 0%;
    min-width: 0;
  }
  .pub-card-media {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 16rem;
    width: 100%;
    flex-shrink: 0;
    padding: 0.5rem;
    box-sizing: border-box;
  }
  .pub-card-media img,
  .pub-card-media video {
    max-height: 100%;
    max-width: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
  }
  @media (min-width: 768px) {
    .pub-card-row {
      flex-direction: row;
      align-items: center;
    }
    .pub-card-media {
      width: 24rem;
    }
  }

  /* Publication awards (junjieye.com style): small muted-gold line with a
     trophy, award name slightly heavier, venue link underlined only subtly. */
  .pub-award {
    font-size: 0.8rem;
    line-height: 1.5;
    color: #a39178;
  }
  .pub-award p {
    margin: 0;
  }
  /* Breathing room between the awards block and the summary line below it. */
  .pub-award + .pub-summary {
    margin-top: 0.85rem !important;
  }
  .pub-award strong,
  .pub-award b {
    font-weight: 600;
    color: #8a7659;
  }
  .pub-award a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid #e8dfd0;
  }
  .pub-award a:hover {
    border-bottom-color: #a39178;
  }
  html.dark .pub-award {
    color: #c9b48e;
  }
  html.dark .pub-award strong,
  html.dark .pub-award b {
    color: #dcc69f;
  }
  html.dark .pub-award a {
    border-bottom-color: rgba(201, 180, 142, 0.35);
  }
  html.dark .pub-award a:hover {
    border-bottom-color: #c9b48e;
  }
  /* Venue links inside regular summary lines: blend in, subtle underline. */
  .pub-summary a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(0, 0, 0, 0.25);
  }
  .pub-summary a:hover {
    border-bottom-color: currentColor;
  }
  html.dark .pub-summary a {
    border-bottom-color: rgba(255, 255, 255, 0.35);
  }

  /* "Full List →" link beside the Featured Publications heading. */
  .full-list-link {
    display: inline-block;
    margin-left: 0.75rem;
    vertical-align: middle;
    font-size: 0.8rem;
    font-weight: 500;
    color: #888;
    text-decoration: none;
    border-bottom: 1px solid #ddd;
    white-space: nowrap;
  }
  .full-list-link:hover {
    color: #555;
    border-bottom-color: #999;
  }
  html.dark .full-list-link {
    color: #aaa;
    border-bottom-color: #555;
  }
  html.dark .full-list-link:hover {
    color: #fff;
    border-bottom-color: #aaa;
  }

  /* Awards: compact list (junjieye.com style) — year · name  from */
  .award-list {
    width: 100%;
    max-width: 56rem;
    margin: 0 auto;
    padding: 0 1.5rem;
    box-sizing: border-box;
  }
  .award-item {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    padding: 0.4rem 0;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .award-year {
    min-width: 2.8rem;
    font-size: 0.8rem;
    font-weight: 500;
    color: #bbb;
  }
  .award-dot {
    color: #ccc;
  }
  .award-name {
    font-weight: 600;
    color: #222;
  }
  .award-name a {
    color: inherit;
    text-decoration: none;
  }
  .award-name a:hover {
    text-decoration: underline;
  }
  .award-from {
    color: #888;
  }
  .award-from a {
    color: #888;
    text-decoration: none;
    border-bottom: 1px solid #ddd;
  }
  .award-from a:hover {
    color: #555;
    border-bottom-color: #999;
  }
  html.dark .award-year { color: #666; }
  html.dark .award-dot { color: #555; }
  html.dark .award-name { color: #eee; }
  html.dark .award-from,
  html.dark .award-from a { color: #999; border-bottom-color: #444; }
  html.dark .award-from a:hover { color: #ddd; border-bottom-color: #888; }
  @media (max-width: 640px) {
    .award-item {
      flex-wrap: wrap;
    }
  }

  /* Full publications list grouped by year (/publication/). */
  .pub-years {
    width: 100%;
    max-width: 56rem;
    margin: 0 auto 3rem;
    padding: 0 1.5rem;
    box-sizing: border-box;
  }
  .pub-year-heading {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    padding-top: 2rem;
    padding-bottom: 0.5rem;
    margin-bottom: 0.25rem;
    border-bottom: 1px solid #eee;
  }
  html.dark .pub-year-heading {
    border-bottom-color: #333;
  }
  .pub-row {
    padding: 0.9rem 0;
    border-bottom: 1px solid #f3f3f3;
  }
  .pub-row:last-child {
    border-bottom: none;
  }
  html.dark .pub-row {
    border-bottom-color: #2a2a2a;
  }
  .pub-row-title {
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 0.15rem;
  }
  .pub-row-title a {
    color: inherit;
    text-decoration: none;
  }
  .pub-row-title a:hover {
    text-decoration: underline;
  }
  .pub-row-authors {
    font-size: 0.85rem;
    color: #777;
    margin-bottom: 0.3rem;
  }
  html.dark .pub-row-authors {
    color: #999;
  }
  .pub-row-venue {
    font-size: 0.85rem;
    margin: 0.15rem 0 0;
  }
  .pub-row .pub-award + .pub-row-venue {
    margin-top: 0.5rem;
  }
  .pub-row-links {
    margin-top: 0.5rem;
  }

  /* Topic switch above publication lists: pill buttons, one active. */
  .pub-filter {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    max-width: 56rem;
    margin: 0 auto 0.25rem;
  }
  .pub-years .pub-filter {
    margin-top: 1rem;
  }
  .pub-filter-btn {
    font-size: 0.8rem;
    font-weight: 500;
    line-height: 1;
    padding: 0.45rem 0.9rem;
    border-radius: 999px;
    border: 1px solid #ddd;
    background: transparent;
    color: #666;
    cursor: pointer;
    transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
  }
  .pub-filter-btn:hover {
    color: #222;
    border-color: #aaa;
  }
  .pub-filter-btn.is-active {
    color: #fff;
    background: rgb(4 120 87);
    border-color: rgb(4 120 87);
  }
  html.dark .pub-filter-btn {
    border-color: #444;
    color: #aaa;
  }
  html.dark .pub-filter-btn:hover {
    color: #eee;
    border-color: #777;
  }
  html.dark .pub-filter-btn.is-active {
    color: #fff;
    background: rgb(4 120 87);
    border-color: rgb(4 120 87);
  }
  [hidden] {
    display: none !important;
  }

  /* Academic services: label + plain comma-separated venues, no pills. */
  .svc-list {
    width: 100%;
    max-width: 56rem;
    margin: 0 auto;
    padding: 0 1.5rem;
    box-sizing: border-box;
  }
  .svc-row {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    padding: 0.4rem 0;
    font-size: 0.95rem;
    line-height: 1.6;
  }
  .svc-label {
    flex: 0 0 11rem;
    font-weight: 600;
    color: #222;
  }
  .svc-tags {
    color: #777;
  }
  .svc-tag + .svc-tag::before {
    content: ", ";
  }
  .svc-tag a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid #ddd;
  }
  .svc-tag a:hover {
    color: #222;
    border-bottom-color: #999;
  }
  html.dark .svc-label { color: #eee; }
  html.dark .svc-tags { color: #999; }
  html.dark .svc-tag a { border-bottom-color: #444; }
  html.dark .svc-tag a:hover { color: #ddd; border-bottom-color: #888; }
  @media (max-width: 640px) {
    .svc-row {
      flex-direction: column;
      gap: 0.15rem;
    }
    .svc-label {
      flex-basis: auto;
    }
  }

  /* Clickable author names linking to homepages (junjieye.com style):
     blend in with the surrounding author text — same color, no bold, no
     underline — and only reveal an underline + slight darkening on hover. */
  .li-cite-author a.author-link,
  .article-metadata a.author-link {
    color: inherit;
    font-weight: inherit;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .li-cite-author a.author-link:hover,
  .article-metadata a.author-link:hover {
    color: #555;
    border-bottom-color: #999;
  }
  html.dark .li-cite-author a.author-link:hover,
  html.dark .article-metadata a.author-link:hover {
    color: #fff;
    border-bottom-color: rgba(255, 255, 255, 0.5);
  }
</style>
