<style>
  /* Featured publication cards: fixed-width list, media contained (not cropped) */
  .pub-card-list {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 56rem;
    min-width: 0;
    margin-left: auto;
    margin-right: auto;
  }
  /* Each card is a block that fills the list width and stacks vertically. */
  .pub-card-list > .pub-card {
    width: 100%;
  }
  /* Media link is transparent to layout so the image/video sizes as before. */
  .pub-card-media > a {
    display: contents;
  }
  /* Attachment button row (PDF, Cite, Video, …) below each card's text. */
  .pub-card-links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem 0.9rem;
    margin-top: 0.85rem;
  }
  .pub-card-row {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-width: 0;
  }
  .pub-card-row > * {
    min-width: 0;
  }
  /* Text column fills the space left of the fixed-width media (no overlap). */
  .pub-card-row > .p-8 {
    flex: 1 1 0%;
    min-width: 0;
  }
  .pub-card-media {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 16rem;
    width: 100%;
    flex-shrink: 0;
    padding: 0.5rem;
    box-sizing: border-box;
  }
  .pub-card-media img,
  .pub-card-media video {
    max-height: 100%;
    max-width: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
  }

    .pub-card-row {
      flex-direction: row;
      align-items: center;
    }
    .pub-card-media {
      width: 24rem;
    }
  }

    font-weight: inherit;

    border-bottom: 1px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .li-cite-author a.author-link:hover,
  .article-metadata a.author-link:hover {
    color: #555;
    border-bottom-color: #999;
  }
  html.dark .li-cite-author a.author-link:hover,
  html.dark .article-metadata a.author-link:hover {
